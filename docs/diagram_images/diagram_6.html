<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  body {
    font-family: 'Inter', sans-serif;
    background-color: #ffffff;
    margin: 0;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
  }
  .wrapper {
    background: #ffffff;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    padding: 15px;
    width: 100%;
    max-width: 1050px;
    box-sizing: border-box;
    text-align: center;
  }
  .title {
    font-size: 20px;
    font-weight: 800;
    color: #1e3a8a;
    margin-bottom: 4px;
    text-align: left;
  }
  .desc {
    font-size: 13px;
    color: #334155;
    margin-bottom: 12px;
    text-align: left;
    font-weight: 500;
  }
  svg {
    max-width: 100%;
    height: auto;
  }
</style>

</head>
<body>
  <div class="wrapper">
    <div class="title">[6] Data Flow Diagram (DFD Level 1)</div>
    <div class="desc">Models functional processes, data transformations, and storage repositories within the system.</div>
    <svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
          <!-- External Entity: Student -->
          <rect x="40" y="200" width="130" height="70" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2" />
          <text x="105" y="240" text-anchor="middle" fill="#1e1b4b" font-weight="bold" font-size="14">Student User</text>

          <!-- Process 1.0 Document & Text Parser -->
          <circle cx="280" cy="120" r="50" fill="#f1f5f9" stroke="#2563eb" stroke-width="2" />
          <text x="280" y="115" text-anchor="middle" fill="#1e3a8a" font-weight="bold" font-size="13">P 1.0</text>
          <text x="280" y="132" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">Parse Inputs</text>

          <!-- Process 2.0 AI Prompt Gateway -->
          <circle cx="280" cy="320" r="50" fill="#ede9fe" stroke="#6d28d9" stroke-width="2" />
          <text x="280" y="315" text-anchor="middle" fill="#312e81" font-weight="bold" font-size="13">P 2.0</text>
          <text x="280" y="332" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">Groq Engine</text>

          <!-- Process 3.0 Sync & Export -->
          <circle cx="560" cy="320" r="50" fill="#d1fae5" stroke="#059669" stroke-width="2" />
          <text x="560" y="315" text-anchor="middle" fill="#064e3b" font-weight="bold" font-size="13">P 3.0</text>
          <text x="560" y="332" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">Export Sync</text>

          <!-- Data Stores -->
          <path d="M 500 100 L 660 100 M 500 140 L 660 140 M 500 100 L 500 140" stroke="#d97706" stroke-width="2" fill="none" />
          <rect x="501" y="101" width="158" height="38" fill="#fef3c7" />
          <text x="580" y="125" text-anchor="middle" fill="#451a03" font-size="12" font-weight="bold">D1: History &amp; Notes DB</text>

          <!-- External Entity: Groq API Cloud -->
          <rect x="730" y="300" width="130" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2" />
          <text x="795" y="340" text-anchor="middle" fill="#312e81" font-weight="bold" font-size="13">Groq API Cloud</text>

          <!-- Data Flows -->
          <line x1="125" y1="200" x2="235" y2="135" stroke="#4338ca" stroke-width="2" />
          <text x="160" y="150" fill="#1e1b4b" font-size="11" font-weight="bold">Raw Document / Text</text>

          <line x1="280" y1="170" x2="280" y2="270" stroke="#2563eb" stroke-width="2" />
          <text x="290" y="220" fill="#1e3a8a" font-size="11" font-weight="bold">Clean Structured Text</text>

          <line x1="330" y1="320" x2="730" y2="335" stroke="#6d28d9" stroke-width="2" />
          <text x="440" y="310" fill="#312e81" font-size="11" font-weight="bold">Prompt Request / Tokens</text>

          <line x1="325" y1="290" x2="500" y2="130" stroke="#d97706" stroke-width="2" />
          <text x="400" y="200" fill="#451a03" font-size="11" font-weight="bold">Save Record</text>

          <line x1="330" y1="330" x2="510" y2="330" stroke="#059669" stroke-width="2" />
          <text x="420" y="345" fill="#064e3b" font-size="11" font-weight="bold">Generated Payload</text>
        </svg>
  </div>
</body>
</html>
